<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Uprizz CMS</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Uprizz CMS — edits _build/content.json (homepage) and _build/projects.json (projects),
   uploads images, and publishes through the editor helper (Cloudflare Worker). */
:root{--bg:#111;--panel:#161616;--panel2:#1c1c1c;--line:#262626;--line2:#303030;--ink:#ededed;--mute:#8a8a8a;--dim:#5c5c5c;
  --blue:#0a8cff;--blue2:#0a8cff22;--green:#3ecf6e;--amber:#f5b041;--red:#ff5c5c;--r:10px}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
.hidden{display:none!important}
::selection{background:#0a8cff55}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:56px 1fr;height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;border-radius:9px;background:var(--panel2);font-weight:600}
.brand img{width:18px;height:18px;border-radius:4px}
.crumb{margin:0 auto;display:flex;align-items:center;gap:8px;color:var(--mute)}
.crumb b{color:var(--ink);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:var(--panel2);color:var(--mute);font-size:12px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.chip.ok i{background:var(--green)}.chip.busy i{background:var(--amber);animation:pulse 1s infinite}.chip.bad i{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.tbtn{height:32px;padding:0 12px;border-radius:8px;background:var(--panel2);display:inline-flex;align-items:center;gap:7px;color:var(--ink);transition:background .2s}
.tbtn:hover{background:#252525}
.tbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.pub{background:var(--blue);color:#fff;font-weight:500}
.pub:hover{background:#2a9bff}
.pub:disabled{background:var(--panel2);color:var(--dim);cursor:default}
.pub .n{background:#ffffff33;border-radius:10px;padding:0 6px;font-size:11px}

.side{border-right:1px solid var(--line);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.side h5{font-size:11px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:14px 10px 6px}
.side h5:first-child{margin-top:4px}
.nav-i{text-decoration:none;display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:8px;color:#cfcfcf;text-align:left;transition:background .15s}
.nav-i:hover{background:var(--panel2)}
.nav-i.on{background:#222;color:#fff}
.nav-i svg{width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:1.5;flex:none}
.nav-i .c{margin-left:auto;color:var(--dim);font-size:12px}
.nav-i .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:auto}
.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}

.main{overflow:auto;position:relative}
.bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;height:56px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg)}
.bar h2{font-size:15px;font-weight:600;margin-right:8px}
.bar .count{color:var(--dim)}
.ibtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#cfcfcf}
.ibtn:hover{background:var(--panel2)}
.ibtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--panel2);margin-left:auto;width:220px}
.search svg{width:14px;height:14px;stroke:var(--mute);fill:none;stroke-width:1.7}
.search input{background:none;border:0;outline:0;width:100%}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse}
th{font-weight:400;color:var(--mute);text-align:left;height:44px;padding:0 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{height:64px;padding:0 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;color:#bdbdbd}
td:last-child{border-right:0}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:#171717}
tbody tr.sel{background:#1a1f26}
tbody tr.drag{opacity:.4}
tbody tr.over td{box-shadow:inset 0 2px 0 var(--blue)}
td.h{width:34px;color:var(--dim);cursor:grab;padding:0 0 0 14px;border-right:0}
td.h svg{width:14px;height:14px;fill:currentColor}
td.t{color:#fff;font-weight:500}
.thumb{width:72px;height:42px;border-radius:7px;background:#222 center/cover no-repeat;border:1px solid #2a2a2a}
.thumb.sq{width:42px}
.thumb.logo{background-size:contain;background-color:#fafafa;background-origin:content-box;padding:6px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:7px;background:#222;color:#cfcfcf;font-size:12px}
.pill.blue{background:var(--blue2);color:#4fb0ff}
.pill.mute{color:var(--dim)}
.pill.amber{background:#f5b04122;color:var(--amber)}
.swatch{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:middle;border:1px solid #333}
.empty{padding:60px;text-align:center;color:var(--dim)}

/* ---------- forms ---------- */
.form{max-width:760px;margin:0 auto;padding:26px 28px 120px}
.form .lead{color:var(--mute);margin:-4px 0 18px}
.row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.row>label{padding-top:8px;color:#d6d6d6}
.row>label small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px;line-height:1.35}
.grp{color:var(--mute);font-size:13px;padding:30px 0 10px;border-bottom:1px solid var(--line)}
.inp,.ta,select.inp{width:100%;background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:8px 11px;outline:0;transition:border-color .15s,background .15s}
.inp:hover,.ta:hover{background:#202020}
.inp:focus,.ta:focus{border-color:var(--blue);background:#1a1a1a}
.ta{resize:vertical;min-height:72px;line-height:1.5}
.ta.big{min-height:130px}
.hint{color:var(--dim);font-size:11.5px;margin-top:6px}
.hint.warn{color:var(--amber)}
.ctr{float:right;color:var(--dim);font-size:11px}
.ctr.over{color:var(--amber)}
.url{display:flex;align-items:center;gap:6px;color:var(--mute);margin-top:7px;font-size:12px}
.url svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5}
.tog{position:relative;width:38px;height:22px;border-radius:12px;background:#333;transition:background .2s;margin-top:5px}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--blue)}.tog.on:after{transform:translateX(16px)}
.colorw{display:flex;gap:8px;align-items:center}
.colorw input[type=color]{width:38px;height:34px;border:0;border-radius:8px;background:none;padding:0;cursor:pointer}
.colorw .inp{width:120px}
.pairs{display:flex;flex-direction:column;gap:6px}
.pair{display:grid;grid-template-columns:140px 1fr 30px;gap:6px}
.mini{height:32px;border-radius:7px;display:grid;place-items:center;color:var(--mute)}
.mini:hover{background:#262626;color:#fff}
.add{display:inline-flex;align-items:center;gap:6px;color:var(--blue);padding:6px 0;font-weight:500}
.cols{display:grid;gap:6px}
.cols .c{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;color:var(--mute)}

/* image field */
.img{display:flex;gap:12px;align-items:flex-start}
.imgbox{position:relative;width:200px;aspect-ratio:var(--ar,1.6);border-radius:9px;background:#1d1d1d center/cover no-repeat;border:1px dashed #333;display:grid;place-items:center;color:var(--dim);overflow:hidden;transition:border-color .2s}
.imgbox.has{border-style:solid;border-color:#2a2a2a}
.imgbox.logo{background-size:contain;background-color:#fafafa;background-origin:content-box;padding:12px}
.imgbox.drop{border-color:var(--blue);background-color:#0a8cff14}
.imgbox .x{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:#000c;color:#fff;font-size:13px;line-height:22px;text-align:center;opacity:0;transition:opacity .2s}
.imgbox:hover .x{opacity:1}
.imgside{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.imgside .tbtn{height:30px}
.imgside .meta{color:var(--dim);font-size:11.5px;max-width:240px;word-break:break-all}
.new{color:#4fb0ff}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.gt{position:relative;border-radius:8px;overflow:hidden;background:#1d1d1d center/cover no-repeat;aspect-ratio:1.25;border:1px solid #2a2a2a;cursor:grab}
.gt.portrait{aspect-ratio:.8}
.gt.drag{opacity:.4}.gt.over{outline:2px solid var(--blue)}
.gt .bar2{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:5px;background:linear-gradient(transparent,#000a);opacity:0;transition:opacity .2s}
.gt:hover .bar2{opacity:1}
.gt .bar2 button{height:22px;padding:0 7px;border-radius:5px;background:#000b;color:#fff;font-size:11px}
.gt .n{position:absolute;left:6px;top:6px;font-size:11px;background:#000a;border-radius:5px;padding:1px 6px;color:#ddd}
.gadd{border:1px dashed #333;border-radius:8px;display:grid;place-items:center;color:var(--mute);aspect-ratio:1.25;transition:border-color .2s,color .2s}
.gadd:hover,.gadd.drop{border-color:var(--blue);color:var(--blue)}

/* ---------- drawer ---------- */
.shade{position:fixed;inset:0;background:#0008;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:6px;height:56px;padding:0 14px;border-bottom:1px solid var(--line)}
.dh h3{font-size:14px;font-weight:600;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db{overflow:auto;flex:1}
.db .form{padding-top:8px}
.danger{color:var(--red)}
.df{height:44px;display:flex;align-items:center;padding:0 18px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}

/* ---------- toasts, modal, login ---------- */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#222;border:1px solid #333;border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px #0008;animation:tin .25s}
.toast.err{border-color:#5a2a2a;background:#2a1717}
.toast button{color:var(--blue);font-weight:500}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal{position:fixed;inset:0;z-index:40;background:#000b;display:grid;place-items:center;padding:20px}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(560px,100%);max-height:85vh;overflow:auto}
.mbox.wide{width:min(1280px,100%);height:88vh;display:flex;flex-direction:column;max-height:none}
.mh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mh h3{font-size:14px;font-weight:600;margin-right:auto}
.mb{padding:16px}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist div span{flex:1}
.hist small{color:var(--dim);display:block}
.pvwrap{flex:1;position:relative;background:#fff}
.pvwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pvwrap .load{position:absolute;inset:0;display:grid;place-items:center;background:var(--panel);color:var(--mute)}
.seg{display:flex;background:var(--panel2);border-radius:8px;padding:2px}
.seg button{height:28px;padding:0 10px;border-radius:6px;color:var(--mute)}
.seg button.on{background:#2a2a2a;color:#fff}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center}
.login form{width:320px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:20px;font-weight:600}
.login p{color:var(--mute)}
.login .pub{height:40px;justify-content:center;border-radius:9px}
.err{color:var(--red)}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{display:none}.row{grid-template-columns:1fr;gap:6px}.row>label{padding-top:0}.crumb{display:none}}
</style>
</head>
<body>

<div class="login hidden" id="login">
  <form id="loginForm">
    <h1>Uprizz CMS</h1>
    <p>Enter the editor password to manage the website.</p>
    <input class="inp" id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="tbtn pub" type="submit">Log in</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div class="app">
  <header class="top">
    <span class="brand"><img src="/apple-touch-icon.png" alt="">CMS</span>
    <div class="crumb"><b>uprizz.com</b><span class="chip" id="deploy"><i></i><span>Checking…</span></span></div>
    <button class="tbtn" id="histBtn" title="Publish history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>History</button>
    <button class="tbtn" id="pvBtn"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Preview</button>
    <button class="tbtn" id="discardBtn" title="Discard all unpublished changes">Discard</button>
    <button class="tbtn pub" id="pubBtn" disabled>Publish <span class="n hidden" id="pubN"></span></button>
  </header>
  <aside class="side" id="side"></aside>
  <main class="main" id="main"><div class="empty">Loading content…</div></main>
</div>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-label="Edit item">
  <div class="dh">
    <h3 id="dTitle"></h3>
    <button class="tbtn" id="dDup">Duplicate</button>
    <button class="tbtn danger" id="dDel">Delete</button>
    <button class="tbtn" id="dDone" title="Close this panel (your changes are kept)">Done</button>
    <button class="tbtn pub" id="dPub" disabled>Publish <span class="n hidden" id="dPubN"></span></button>
  </div>
  <div class="db" id="dBody"></div>
  <div class="df"><span id="dHint"></span></div>
</aside>
<div class="toasts" id="toasts"></div>

<script>
/* ============================================================
   Config
   ============================================================ */
const API = 'https://uprizz-editor.ergimema06.workers.dev';
const REPO = 'ergimema06-spec/uprizz-website';
const RAW = `https://raw.githubusercontent.com/${REPO}/main/`;
const FILES = { content: '_build/content.json', projects: '_build/projects.json' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slugify = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'item';
const clone = o => JSON.parse(JSON.stringify(o));
const serialize = o => JSON.stringify(o, null, 2) + '\n';

const S = {
  token: null,
  base: {},            // file -> {sha, text}  (what is on GitHub)
  data: {},            // file -> parsed object (being edited)
  uploads: {},         // image path -> {base64, url}  (not published yet)
  local: {},           // image path -> blob url (published this session; may not be deployed yet)
  view: { type: 'col', id: 'projects' },
  open: null,          // index of the item open in the drawer
  q: '',
  autoSlug: new WeakSet(), // new projects whose slug still follows the title
  oldSlugs: new Set(),     // projects that already exist on GitHub (have a default cover.jpg)
};
function uniqueSlug(base, self) {
  base = slugify(base); let s = base, n = 2;
  while (S.data.projects && S.data.projects.some(p => p !== self && p.slug === s)) s = `${base}-${n++}`;
  return s;
}

/* ============================================================
   API + GitHub
   ============================================================ */
async function api(path, body) {
  const r = await fetch(API + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/login') { showLogin(); throw new Error('Please log in again.'); }
  if (!r.ok) throw new Error(j.error || 'Request failed (' + r.status + ')');
  return j;
}
async function blobSha(text) {
  const body = new TextEncoder().encode(text), head = new TextEncoder().encode('blob ' + body.length + '\0');
  const all = new Uint8Array(head.length + body.length); all.set(head); all.set(body, head.length);
  return [...new Uint8Array(await crypto.subtle.digest('SHA-1', all))].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function loadFile(path) {
  // The GitHub API is always fresh; raw.githubusercontent.com is the fallback (cached a few minutes).
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=main&t=${Date.now()}`, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
    if (r.ok) {
      const j = await r.json(); const bin = atob(j.content.replace(/\n/g, ''));
      const text = new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
      return { sha: j.sha, text };
    }
  } catch (e) {}
  const r = await fetch(RAW + path + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('Could not load ' + path);
  const text = await r.text();
  return { sha: await blobSha(text), text };
}
const imgUrl = p => !p ? '' : /^(https?:)?\/\//.test(p) ? p : (S.uploads[p] && S.uploads[p].url) || S.local[p] || RAW + p.replace(/^\//, '');

/* ============================================================
   Drafts (IndexedDB, survives reloads until published)
   ============================================================ */
const idb = (() => {
  let db; const open = () => db || (db = new Promise((ok, bad) => { const r = indexedDB.open('uprizz-cms', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error); }));
  const tx = async (mode, fn) => { const d = await open(); return new Promise((ok, bad) => { const t = d.transaction('kv', mode); const q = fn(t.objectStore('kv')); t.oncomplete = () => ok(q && q.result); t.onerror = () => bad(t.error); }); };
  return { get: k => tx('readonly', s => s.get(k)).catch(() => null), set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => {}), del: k => tx('readwrite', s => s.delete(k)).catch(() => {}) };
})();
let saveT;
function saveDraft() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    if (!isDirty()) { idb.del('draft'); return; }
    const uploads = {}; for (const [p, u] of Object.entries(S.uploads)) uploads[p] = { base64: u.base64, type: u.type };
    idb.set('draft', { base: { content: S.base.content.sha, projects: S.base.projects.sha }, data: S.data, uploads, at: Date.now() });
  }, 300);
}
function b64ToUrl(b64, type) { const bin = atob(b64); return URL.createObjectURL(new Blob([Uint8Array.from(bin, c => c.charCodeAt(0))], { type: type || 'image/jpeg' })); }

/* ============================================================
   Dirty state + publish
   ============================================================ */
const dirtyFiles = () => Object.keys(FILES).filter(k => S.base[k] && serialize(S.data[k]) !== S.base[k].norm);
const usedUploads = () => { const all = serialize(S.data.content) + serialize(S.data.projects); return Object.keys(S.uploads).filter(p => all.includes(p)); };
const isDirty = () => dirtyFiles().length > 0;
function changed() {
  const n = dirtyFiles().length ? changeSummary().length : 0;
  for (const [b, c] of [['pubBtn', 'pubN'], ['dPub', 'dPubN']]) { $(b).disabled = !n || publishing; $(c).textContent = n; $(c).classList.toggle('hidden', !n); }
  $('dHint').textContent = n ? 'Saved as a draft. Press Publish to put it live.' : 'Everything is published.';
  $('discardBtn').classList.toggle('hidden', !n);
  renderSide(); saveDraft();
}
/** Human list of what changed, for the button count and the commit message. */
function changeSummary() {
  const out = [];
  if (S.base.content && serialize(S.data.content) !== S.base.content.norm) {
    const before = JSON.parse(S.base.content.text);
    for (const k of Object.keys(S.data.content)) if (JSON.stringify(S.data.content[k]) !== JSON.stringify(before[k])) out.push(LABELS[k] || k);
  }
  if (S.base.projects && serialize(S.data.projects) !== S.base.projects.norm) {
    const before = JSON.parse(S.base.projects.text), bySlug = Object.fromEntries(before.map(p => [p.slug, JSON.stringify(p)]));
    const names = S.data.projects.filter(p => bySlug[p.slug] !== JSON.stringify(p)).map(p => p.name);
    const removed = before.filter(p => !S.data.projects.some(x => x.slug === p.slug)).map(p => p.name + ' (removed)');
    const order = before.map(p => p.slug).join() !== S.data.projects.map(p => p.slug).join() && !names.length && !removed.length ? ['order'] : [];
    out.push('Projects' + ([...names, ...removed, ...order].length ? ': ' + [...names, ...removed, ...order].join(', ') : ''));
  }
  return out;
}
const LABELS = { seo: 'SEO', hero: 'Hero', logos: 'Client logos', work: 'Selected work', comparison: 'Comparison', process: 'Steps', pricing: 'Pricing', testimonials: 'Testimonials', faq: 'FAQ', contact: 'Contact & footer' };

let publishing = false;
async function publish() {
  const files = dirtyFiles(); if (!files.length) return;
  const before = new Set(JSON.parse(S.base.projects.text).map(p => p.slug));
  const missing = S.data.projects.filter(p => !p.draft && (!p.name || (!before.has(p.slug) && !p.cover)));
  if (missing.length && !confirm(`${missing.map(p => p.name || 'An untitled project').join(', ')} ${missing.length > 1 ? 'are' : 'is'} missing a title or cover image and will look unfinished on the site. Publish anyway? (Tip: turn on “Hide from site” to publish it as a draft.)`)) return;
  const featured = S.data.projects.filter(p => p.featured && !p.draft).length;
  if (featured > 3 && !confirm(`${featured} projects are set to show on the homepage, but only the first 3 will appear. Publish anyway?`)) return;
  publishing = true; for (const b of ['pubBtn', 'dPub']) { $(b).disabled = true; $(b).firstChild.textContent = 'Publishing… '; }
  try {
    const summary = changeSummary();
    const changes = [];
    for (const k of files) changes.push({ path: FILES[k], baseSha: S.base[k].sha, after: serialize(S.data[k]) });
    const imgs = usedUploads().map(p => ({ path: p, base64: S.uploads[p].base64 }));
    const r = await api('/api/publish', { changes, images: imgs, summary: 'CMS: ' + summary.join(' · ') });
    for (const k of files) { const t = serialize(S.data[k]); S.base[k] = { sha: await blobSha(t), text: t, norm: t }; }
    S.oldSlugs = new Set(S.data.projects.map(p => p.slug));
    for (const p of Object.keys(S.uploads)) { S.local[p] = S.uploads[p].url; }
    S.uploads = {}; await idb.del('draft');
    toast('Published. The site updates in about a minute.', { label: 'Undo', fn: () => undo(r.commit) });
    pollDeploy(r.commit);
  } catch (e) {
    toast(/changed since/.test(e.message) ? 'Someone else changed the site while you were editing. Reload the CMS to get the latest version, then redo your change.' : e.message, null, true);
  } finally { publishing = false; for (const b of ['pubBtn', 'dPub']) $(b).firstChild.textContent = 'Publish '; changed(); if (S.view.type === 'col') renderCollection($('main'), S.view.id); }
}
async function undo(commit) {
  if (isDirty() && !confirm('Undoing will reload the CMS and drop your unpublished changes. Continue?')) return;
  try { const r = await api('/api/undo', { commit }); toast('Undone. The site goes back in about a minute.'); await idb.del('draft'); await load(true); pollDeploy(r.commit); }
  catch (e) { toast(e.message, null, true); }
}
async function discard() {
  if (!confirm('Discard all unpublished changes?')) return;
  for (const k of Object.keys(FILES)) S.data[k] = JSON.parse(S.base[k].text);
  S.uploads = {}; await idb.del('draft'); closeDrawer(); render(); changed(); toast('Changes discarded.');
}

/* deploy status */
let pollT;
async function pollDeploy(sha) {
  clearTimeout(pollT);
  const el = $('deploy'), txt = el.querySelector('span');
  try {
    const s = await api('/api/status');
    const d = s.deploy, same = !sha || (d && d.sha && sha.startsWith(d.sha.slice(0, 7))) || (d && d.sha === sha);
    if (d && same && d.status === 'completed') {
      el.className = 'chip ' + (d.conclusion === 'success' ? 'ok' : 'bad');
      txt.textContent = d.conclusion === 'success' ? 'Live' : 'Deploy failed';
      if (d.conclusion !== 'success') el.onclick = () => open(`https://github.com/${REPO}/actions`, '_blank');
      return;
    }
    el.className = 'chip busy'; txt.textContent = 'Publishing…';
  } catch (e) { el.className = 'chip'; txt.textContent = 'Offline'; return; }
  pollT = setTimeout(() => pollDeploy(sha), 6000);
}

const fileToB64 = blob => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
/** Resize + convert a picked file. Logos keep PNG/SVG so transparency survives; photos become JPEG ≤1800px. */
async function processImage(file, { logo = false, max = 1800 } = {}) {
  if (!/^image\//.test(file.type)) throw new Error('That file is not an image.');
  if (file.type === 'image/svg+xml') return { blob: file, ext: 'svg', type: file.type, w: 0, h: 0 };
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d');
  const png = logo && file.type === 'image/png';
  if (!png) { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); }
  g.drawImage(bmp, 0, 0, w, h);
  const type = png ? 'image/png' : 'image/jpeg';
  const blob = await new Promise(ok => cv.toBlob(ok, type, 0.84));
  return { blob, ext: png ? 'png' : 'jpg', type, w, h };
}
async function addUpload(file, dir, base, opts) {
  const im = await processImage(file, opts);
  const path = `${dir}/${slugify(base)}-${Date.now().toString(36)}.${im.ext}`;
  S.uploads[path] = { base64: await fileToB64(im.blob), url: URL.createObjectURL(im.blob), type: im.type };
  return { path, w: im.w, h: im.h };
}
function pickFiles(multiple) {
  return new Promise(ok => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = !!multiple; i.onchange = () => ok([...i.files]); i.click(); });
}

        const i = el(`<input class="inp" type="number" value="${esc(v ?? '')}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} style="width:140px">`); box.appendChild(i);
        i.addEventListener('input', () => set(i.value === '' ? '' : Number(i.value))); break;
      }
      case 'textarea': {
        const i = el(`<textarea class="ta${f.big ? ' big' : ''}"></textarea>`); i.value = v ?? ''; box.appendChild(i); autogrow(i);
        if (f.max) { const c = el(`<span class="ctr"></span>`); box.prepend(c); const u = () => { c.textContent = i.value.length + ' / ' + f.max; c.classList.toggle('over', i.value.length > f.max); }; i.addEventListener('input', u); u(); }
        i.addEventListener('input', () => set(i.value)); break;
      }
      case 'paras': {
        const i = el(`<textarea class="ta big"></textarea>`); i.value = (v || []).join('\n\n'); box.appendChild(i); autogrow(i);
        box.appendChild(el('<div class="hint">Leave an empty line between paragraphs.</div>'));
        i.addEventListener('input', () => set(i.value.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean))); break;
      }
      case 'lines': {
        const i = el(`<textarea class="ta"></textarea>`); i.value = (v || []).join('\n'); box.appendChild(i); autogrow(i);
        i.addEventListener('input', () => set(i.value.split('\n').map(s => s.trim()).filter(Boolean))); break;
      }
      case 'tags': {
        const i = el(`<input class="inp" value="${esc((v || []).join(', '))}">`); box.appendChild(i);
        i.addEventListener('input', () => set(i.value.split(',').map(s => s.trim()).filter(Boolean))); break;
      }
      case 'toggle': {
        const t = el(`<button type="button" class="tog${v ? ' on' : ''}" role="switch" aria-checked="${!!v}"></button>`); box.appendChild(t);
        t.onclick = () => { const nv = !obj[f.k]; t.classList.toggle('on', nv); t.setAttribute('aria-checked', nv); set(nv); }; break;
      }
      case 'color': {
        const w = el(`<div class="colorw"><input type="color" value="${esc(/^#[0-9a-f]{6}$/i.test(v) ? v : '#ed6c47')}"><input class="inp" value="${esc(v || '')}"></div>`); box.appendChild(w);
        const [c, t] = w.querySelectorAll('input');
        c.addEventListener('input', () => { t.value = c.value; set(c.value); });
        t.addEventListener('input', () => { if (/^#[0-9a-f]{6}$/i.test(t.value)) c.value = t.value; set(t.value); }); break;
      }
      case 'select': {
        const opts = typeof f.opts === 'function' ? f.opts() : f.opts;
        const s = el(`<select class="inp">${opts.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`); box.appendChild(s);
        s.addEventListener('change', () => set(s.value)); break;
      }
      case 'cols': {
        const names = C().comparison.columns; const w = el('<div class="cols"></div>');
        names.forEach((n, i) => { const r = el(`<div class="c"><span>${esc(n)}</span><input class="inp" value="${esc((v || [])[i] ?? '')}"></div>`); r.querySelector('input').addEventListener('input', e => { const arr = [...(obj[f.k] || [])]; while (arr.length < names.length) arr.push(''); arr[i] = e.target.value; set(arr); }); w.appendChild(r); });
        box.appendChild(w); break;
      }
      case 'colnames': {
        const w = el('<div class="cols"></div>');
        (v || []).forEach((n, i) => { const r = el(`<div class="c"><span>Column ${i + 1}</span><input class="inp" value="${esc(n)}"></div>`);
          r.querySelector('input').addEventListener('input', e => { const arr = [...obj.columns]; const old = arr[i]; arr[i] = e.target.value; if (obj.highlight === old) obj.highlight = e.target.value; set(arr); });
          w.appendChild(r); });
        box.appendChild(w); break;
      }
      case 'pairs': {
        const w = el('<div class="pairs"></div>'); box.appendChild(w);
        const draw = () => {
          w.innerHTML = '';
          (obj[f.k] || []).forEach((p, i) => {
            const r = el(`<div class="pair"><input class="inp" placeholder="Name" value="${esc(p.name)}"><input class="inp" placeholder="https://" value="${esc(p.url)}"><button type="button" class="mini" title="Remove">×</button></div>`);
            const [a, b] = r.querySelectorAll('input');
            a.addEventListener('input', () => { obj[f.k][i].name = a.value; changed(); });
            b.addEventListener('input', () => { obj[f.k][i].url = b.value; changed(); });
            r.querySelector('button').onclick = () => { obj[f.k].splice(i, 1); changed(); draw(); };
            w.appendChild(r);
          });
          const add = el('<button type="button" class="add">+ Add link</button>'); add.onclick = () => { (obj[f.k] = obj[f.k] || []).push({ name: '', url: 'https://' }); changed(); draw(); }; w.appendChild(add);
        };
        draw(); break;
      }
      case 'image': box.appendChild(imageField(obj, f, ctx)); break;
      case 'gallery': box.appendChild(galleryField(obj, f)); break;
    }
    wrap.appendChild(row);
  }
  return wrap;
}

function imageField(obj, f, ctx) {
  const w = el(`<div class="img"><div class="imgbox${f.logo ? ' logo' : ''}" style="--ar:${f.ar || 1.6};${f.small ? 'width:120px' : ''}"><span class="ph">Drop image</span><button type="button" class="x" title="Remove">×</button></div>
    <div class="imgside"><button type="button" class="tbtn up">Upload</button><span class="meta"></span></div></div>`);
  const box = w.querySelector('.imgbox'), meta = w.querySelector('.meta'), up = w.querySelector('.up');
  const draw = () => {
    const p = obj[f.k] || (f.def ? f.def(obj) : '');
    box.style.backgroundImage = p ? `url("${imgUrl(p)}")` : ''; box.classList.toggle('has', !!p);
    box.querySelector('.ph').style.display = p ? 'none' : '';
    box.querySelector('.x').style.display = obj[f.k] ? '' : 'none';
    up.textContent = p ? 'Replace' : 'Upload';
    meta.innerHTML = p ? (S.uploads[p] ? '<span class="new">New · publishes with your changes</span>' : esc(p.split('/').pop())) : '';
  };
  const use = async file => {
    try {
      const dir = f.dir ? f.dir(obj) : 'images/cms';
      const base = (obj.slug || obj.name || obj.title || f.k) + '-' + f.k;
      const r = await addUpload(file, dir, base, { logo: f.logo });
      obj[f.k] = r.path; changed(); draw(); if (ctx.refresh) ctx.refresh();
    } catch (e) { toast(e.message, null, true); }
  };
  up.onclick = async () => { const [file] = await pickFiles(false); if (file) use(file); };
  box.onclick = e => { if (e.target.classList.contains('x')) return; up.click(); };
  box.querySelector('.x').onclick = e => { e.stopPropagation(); obj[f.k] = ''; changed(); draw(); if (ctx.refresh) ctx.refresh(); };
  box.ondragover = e => { e.preventDefault(); box.classList.add('drop'); };
  box.ondragleave = () => box.classList.remove('drop');
  box.ondrop = e => { e.preventDefault(); box.classList.remove('drop'); const file = e.dataTransfer.files[0]; if (file) use(file); };
  draw(); return w;
}

function galleryField(obj, f) {
  const w = el('<div class="gal"></div>');
  let dragI = null;
  const draw = () => {
    w.innerHTML = '';
    (obj[f.k] || []).forEach((g, i) => {
      const path = g.file.includes('/') ? g.file : `${f.dir(obj)}/${g.file}`;
      const t = el(`<div class="gt ${g.shape === 'portrait' ? 'portrait' : ''}" draggable="true" style="background-image:url('${imgUrl(path)}')"><span class="n">${i + 1}</span>
        <div class="bar2"><button type="button" class="sh">${g.shape === 'portrait' ? 'Tall' : 'Wide'}</button><button type="button" class="rm">Remove</button></div></div>`);
      t.querySelector('.sh').onclick = e => { e.stopPropagation(); g.shape = g.shape === 'portrait' ? 'landscape' : 'portrait'; changed(); draw(); };
      t.querySelector('.rm').onclick = e => { e.stopPropagation(); obj[f.k].splice(i, 1); changed(); draw(); };
      t.ondragstart = () => { dragI = i; t.classList.add('drag'); };
      t.ondragend = () => { t.classList.remove('drag'); w.querySelectorAll('.over').forEach(x => x.classList.remove('over')); };
      t.ondragover = e => { if (dragI === null) return; e.preventDefault(); t.classList.add('over'); };
      t.ondragleave = () => t.classList.remove('over');
      t.ondrop = e => { e.preventDefault(); if (dragI === null) return; const arr = obj[f.k]; const [m] = arr.splice(dragI, 1); arr.splice(i, 0, m); dragI = null; changed(); draw(); };
      w.appendChild(t);
    });
    const add = el('<button type="button" class="gadd">+ Add images</button>');
    const addFiles = async files => {
      for (const file of files) {
        try { const r = await addUpload(file, f.dir(obj), obj.slug + '-photo', {}); (obj[f.k] = obj[f.k] || []).push({ file: r.path, shape: r.h > r.w ? 'portrait' : 'landscape' }); }
        catch (e) { toast(e.message, null, true); }
      }
      changed(); draw();
    };
    add.onclick = async () => addFiles(await pickFiles(true));
    add.ondragover = e => { if (dragI !== null) return; e.preventDefault(); add.classList.add('drop'); };
    add.ondragleave = () => add.classList.remove('drop');
    add.ondrop = e => { e.preventDefault(); add.classList.remove('drop'); if (dragI === null) addFiles([...e.dataTransfer.files].filter(x => /^image\//.test(x.type))); };
    w.appendChild(add);
  };
  draw(); return w;
}

/* ---------- drawer ---------- */
function openItem(i) {
  const id = S.view.id, c = COLLECTIONS[id], list = c.list(), x = list[i]; if (!x) return;
  S.open = i;
  const title = () => $('dTitle').textContent = c.title(x) || 'Untitled';
  title();
  const body = $('dBody'); body.innerHTML = '<div class="form"></div>';
  const ctx = {
    onChange: k => {
      title(); refreshRow();
      if (k === 'name' && S.autoSlug.has(x)) {          // new project: page address follows the title
        const ns = uniqueSlug(slugify(x.name || 'new-project'), x);
        if (ns !== x.slug) { x.slug = ns; const si = $('dBody').querySelector('input[data-k="slug"]'); if (si) { si.value = ns; si.dispatchEvent(new Event('sync')); } }
      }
    },
    refresh: () => refreshRow(),
    onSlug: (oldS, newS) => {
      if (!newS) return false;
      if (S.data.projects.some(p => p !== x && p.slug === newS)) { toast('Another project already uses that slug.', null, true); return false; }
      S.autoSlug.delete(x);   // typed by hand: stop following the title
      // keep existing photos pointing at their current folder
      if (!x.cover) x.cover = `images/projects/${oldS}/cover.jpg`;
      (x.gallery || []).forEach(g => { if (!g.file.includes('/')) g.file = `images/projects/${oldS}/${g.file}`; });
      return true;
    },
  };
  body.firstChild.appendChild(buildForm(x, c.fields, ctx));
  $('drawer').classList.add('on'); $('shade').classList.add('on');
  $('dDel').onclick = () => {
    if (!confirm(`Delete “${c.title(x) || 'this item'}”? You can still discard before publishing.`)) return;
    list.splice(i, 1); closeDrawer(); changed(); render();
  };
  $('dDup').onclick = () => {
    const d = clone(x);
    if (id === 'projects') { d.slug = slugify(d.slug + '-copy-' + Date.now().toString(36).slice(-3)); d.name += ' (copy)'; d.featured = false; if (!d.cover) d.cover = `images/projects/${x.slug}/cover.jpg`; (d.gallery || []).forEach(g => { if (!g.file.includes('/')) g.file = `images/projects/${x.slug}/${g.file}`; }); }
    else if (d.name != null) d.name += ' (copy)'; else if (d.question != null) d.question += ' (copy)'; else if (d.title != null) d.title += ' (copy)'; else if (d.label != null) d.label += ' (copy)';
    list.splice(i + 1, 0, d); changed(); render(); openItem(i + 1);
  };
  function refreshRow() { if (S.view.type === 'col') renderCollection($('main'), id); }
  render();
}
function closeDrawer() { S.open = null; $('drawer').classList.remove('on'); $('shade').classList.remove('on'); if (S.view.type === 'col' && S.base.content) renderCollection($('main'), S.view.id); }

  if (action) { const b = el(`<button>${esc(action.label)}</button>`); b.onclick = () => { t.remove(); action.fn(); }; t.appendChild(b); }

/* ---------- history ---------- */
async function showHistory() {
  const m = el(`<div class="modal"><div class="mbox"><div class="mh"><h3>Publish history</h3><button class="ibtn" aria-label="Close">${'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'}</button></div><div class="mb"><div class="hist">Loading…</div></div></div></div>`);
  document.body.appendChild(m); m.querySelector('.ibtn').onclick = () => m.remove(); m.onclick = e => { if (e.target === m) m.remove(); };
  try {
    const lists = await Promise.all(Object.values(FILES).map(p => fetch(`https://api.github.com/repos/${REPO}/commits?path=${p}&per_page=12`).then(r => r.ok ? r.json() : [])));
    const seen = new Set(), all = lists.flat().filter(c => !seen.has(c.sha) && seen.add(c.sha)).sort((a, b) => new Date(b.commit.author.date) - new Date(a.commit.author.date)).slice(0, 15);
    const h = m.querySelector('.hist');
    h.innerHTML = all.length ? '' : 'No changes yet.';
    all.forEach((c, i) => {
      const d = el(`<div><span>${esc(c.commit.message.split('\n')[0].replace(/^(CMS|Editor): /, ''))}<small>${new Date(c.commit.author.date).toLocaleString()}</small></span>${i === 0 ? '<span class="pill blue" style="flex:none">Latest</span>' : ''}<button class="tbtn">Undo</button></div>`);
      d.querySelector('button').onclick = () => { if (confirm('Undo this change? Its files go back to how they were before it. Later changes to the same files may also be reverted.')) { m.remove(); undo(c.sha); } };
      h.appendChild(d);
    });
  } catch (e) { m.querySelector('.hist').textContent = 'Could not load the history.'; }
}

/* ---------- preview (runs the real page builder in the browser) ---------- */
let pyodideReady = null;
function loadPy() {
  if (!pyodideReady) pyodideReady = new Promise((ok, bad) => {
    const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
    sc.onload = () => loadPyodide().then(ok, bad); sc.onerror = () => bad(new Error('Could not load the preview builder.'));
    document.head.appendChild(sc);
  });
  return pyodideReady;
}
async function buildPreview(page) {
  const [py, build, index] = await Promise.all([loadPy(), ...['_build/build.py', 'index.html'].map(p => fetch(RAW + p + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()))]);
  py.FS.mkdirTree('/site/_build');
  py.FS.writeFile('/site/_build/build.py', build); py.FS.writeFile('/site/index.html', index);
  py.FS.writeFile('/site/_build/content.json', serialize(S.data.content)); py.FS.writeFile('/site/_build/projects.json', serialize(S.data.projects));
  await py.runPythonAsync("import runpy, os, sys\nos.chdir('/site')\nsys.argv=['build.py']\nrunpy.run_path('/site/_build/build.py', run_name='__main__')");
  let html = py.FS.readFile(page === '/' ? '/site/index.html' : '/site' + page + 'index.html', { encoding: 'utf8' });
  html = html.replace(/\?v=preview/g, '?v=' + Date.now());
  for (const [p, u] of [...Object.entries(S.uploads).map(([p, x]) => [p, x.url]), ...Object.entries(S.local)])
    for (const pre of ['/', '']) html = html.split('"' + pre + p + '"').join('"' + u + '"').split('(' + pre + p + ')').join('(' + u + ')');
  return html.replace('<head>', `<head><base href="${location.origin}/">`);
}
function showPreview() {
  const pages = [['/', 'Home'], ['/pricing/', 'Pricing'], ['/comparison/', 'Comparison'], ['/work/', 'Work'], ...S.data.projects.map(p => [`/projects/${p.slug}/`, p.name])];
  const m = el(`<div class="modal"><div class="mbox wide"><div class="mh"><h3>Preview</h3>
    <select class="inp" style="width:220px" id="pvPage">${pages.map(([u, n]) => `<option value="${esc(u)}">${esc(n)}</option>`).join('')}</select>
    <div class="seg"><button class="on" data-w="100%">Desktop</button><button data-w="390px">Mobile</button></div>
    <span class="chip">${isDirty() ? 'Includes unpublished changes' : 'Same as the live site'}</span>
    <button class="ibtn" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="pvwrap"><iframe title="Preview"></iframe><div class="load">Building preview…</div></div></div></div>`);
  document.body.appendChild(m);
  const f = m.querySelector('iframe'), load = m.querySelector('.load');
  m.querySelector('.ibtn').onclick = () => m.remove();
  m.querySelectorAll('.seg button').forEach(b => b.onclick = () => { m.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b)); f.style.width = b.dataset.w; f.style.left = b.dataset.w === '100%' ? '0' : 'calc(50% - 195px)'; });
  const go = async () => {
    load.style.display = ''; load.textContent = pyodideReady ? 'Building preview…' : 'Building preview… (the first one takes about 15 seconds)';

  m.querySelector('#pvPage').onchange = go; go();
}

  try {
    const { token } = await api('/api/login', { password: $('pw').value });
    S.token = token; try { sessionStorage.setItem('uprizzToken', token); } catch (e) {}
    $('login').classList.add('hidden'); $('pw').value = ''; pollDeploy();
    if (!S.base.content) load();
  } catch (e2) { $('loginErr').textContent = e2.message; }
};

async function load(fresh) {
  try {
    const [content, projects] = await Promise.all([loadFile(FILES.content), loadFile(FILES.projects)]);
    S.base = { content: { ...content, norm: serialize(JSON.parse(content.text)) }, projects: { ...projects, norm: serialize(JSON.parse(projects.text)) } };
    S.data = { content: JSON.parse(content.text), projects: JSON.parse(projects.text) };
    S.oldSlugs = new Set(S.data.projects.map(p => p.slug));
    S.uploads = {};
    const d = fresh ? null : await idb.get('draft');
    if (d && d.data) {
      const same = d.base.content === content.sha && d.base.projects === projects.sha;
      if (same || confirm('You have unpublished changes from an earlier visit, but the website has changed since then. Keep your changes? (Cancel discards them.)')) {
        S.data = d.data;
        for (const [p, u] of Object.entries(d.uploads || {})) S.uploads[p] = { base64: u.base64, type: u.type, url: b64ToUrl(u.base64, u.type) };
        toast('Your unpublished changes were restored.');
      } else await idb.del('draft');
    }
    render(); changed();
  } catch (e) { $('main').innerHTML = `<div class="empty">Could not load the site content. ${esc(e.message)}</div>`; }
}

$('pubBtn').onclick = publish;
$('discardBtn').onclick = discard;
$('pvBtn').onclick = showPreview;
$('histBtn').onclick = showHistory;
window.addEventListener('beforeunload', e => { if (isDirty()) { saveDraft(); } });

try { S.token = sessionStorage.getItem('uprizzToken'); } catch (e) {}
if (!S.token) showLogin(); else pollDeploy();
load();
</script>
</body>
</html>
