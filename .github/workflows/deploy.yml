# Builds the generated pages (Work, projects, sitemap) and publishes uprizz.com.
# Runs on every change to main, including edits made from the /admin editor.
name: Build and deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - "_admin/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build project pages
        run: python3 _build/build.py
      - name: Collect public files
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site --exclude=./_admin \
              --exclude=./_build --exclude=./admin-worker --exclude=./CLAUDE.md -cf - . | tar -xf - -C _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
